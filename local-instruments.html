<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EL-SYSTEMA Local Instruments</title>
<link rel="icon" href="data:,">
<style>
  :root{--bg:#050a09;--panel:#091410;--line:#214637;--ink:#d7f5dc;--muted:#709581;--signal:#d0ff5a}
  *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 0,#163323 0,transparent 34%),var(--bg);color:var(--ink);font:14px/1.5 ui-monospace,Menlo,monospace}
  main{width:min(1040px,calc(100% - 32px));margin:auto;padding:42px 0 60px}header{display:flex;align-items:end;justify-content:space-between;gap:20px;border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:22px}
  h1{margin:0;color:var(--signal);font-size:clamp(24px,5vw,52px);line-height:.95;letter-spacing:.08em}p{margin:8px 0 0;color:var(--muted)}
  .hub{color:var(--signal);text-decoration:none;border:1px solid var(--signal);padding:10px 14px;white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
  article{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:10px;background:linear-gradient(120deg,var(--panel),#07100d);border:1px solid var(--line);padding:14px}.n{color:var(--muted)}h2{font-size:13px;margin:0;letter-spacing:.05em}small{color:var(--muted)}
  article a{color:var(--ink);text-decoration:none;border:1px solid var(--line);padding:7px 10px}article a:hover{color:var(--signal);border-color:var(--signal)}
  @media(max-width:600px){header{align-items:start;flex-direction:column}.hub{width:100%;text-align:center}}
</style>
</head>
<body><main>
  <header><div><h1>LOCAL FIELD</h1><p>EL-SYSTEMA instruments / localhost</p></div><a class="hub" href="/hub.html">OPEN LIVE HUB</a></header>
  <section class="grid" id="grid"></section>
</main>
<script>
const instruments = [
  ['BeatGenerator',8801,'/'],['BassGenerator',8802,'/prime-pulse-monolith.html'],['籠目',8803,'/'],
  ['ParticleNoise',8804,'/'],['GEO/OSC',8805,'/'],['GEO/OSC/HUB',8806,'/geometry-instruments/master.html'],
  ['CellNoiseGenerator',8807,'/public/launch-20260524c.html'],['Stonebeats',8808,'/stone-beats.html'],
  ['Ocean',8808,'/ocean.html'],['Planarian Drone',8809,'/']
];
document.querySelector('#grid').innerHTML = instruments.map((item,index) => {
  const url = `http://localhost:${item[1]}${item[2]}?field`;
  return `<article><span class="n">${String(index+1).padStart(2,'0')}</span><div><h2>${item[0]}</h2><small>:${item[1]}</small></div><a href="${url}">OPEN</a></article>`;
}).join('');
</script>
</body></html>
